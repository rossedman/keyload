name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.22", "stable"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: grpccreds
        working-directory: grpccreds
        run: |
          go vet ./...
          go test -race ./...
      - name: fuzz (short)
        if: matrix.os == 'ubuntu-latest' && matrix.go == 'stable'
        run: go test -run '^$' -fuzz FuzzParseMaterial -fuzztime 30s .
