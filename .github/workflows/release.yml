name: Release

# Release by pushing a tag (git push origin v1.2.3), or run this workflow
# manually with a version: it creates the tag on the chosen branch's head,
# then releases it. Either way CHANGELOG.md must have a section for the
# version (it becomes the release notes) and grpccreds/go.mod must require
# that version of keyload. The grpccreds module is tagged grpccreds/v1.2.3 on
# the same commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to tag and release, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"

      - name: Check the version, changelog and grpccreds/go.mod
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Not a version tag: $TAG"; exit 1; }
          grep -q "^## \[${TAG#v}\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
          required=$(cd grpccreds && go mod edit -json | jq -r '.Require[] | select(.Path=="github.com/rossedman/keyload") | .Version')
          [ "$required" = "$TAG" ] || { echo "grpccreds/go.mod requires keyload $required, want $TAG (run make bump VERSION=$TAG)"; exit 1; }

      - name: Test
        run: |
          go test -race ./...
          (cd grpccreds && go test -race ./...)

      - name: Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in "$TAG" "grpccreds/$TAG"; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              [ "$(git rev-list -n1 "$tag")" = "$(git rev-parse HEAD)" ] || { echo "$tag already exists on another commit"; exit 1; }
              continue
            fi
            git tag -a "$tag" -m "keyload $tag" HEAD
            git push origin "refs/tags/$tag"
          done

      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          cat >> "$RUNNER_TEMP/notes.md" <<NOTES

          ## Install

          \`\`\`sh
          go get github.com/rossedman/keyload@$TAG
          go get github.com/rossedman/keyload/grpccreds@$TAG   # for grpc-go
          \`\`\`
          NOTES
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          [[ "$TAG" == *-* ]] && prerelease="--prerelease"
          gh release create "$TAG" --title "keyload $TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $prerelease

      - name: Tell the Go module proxy
        run: |
          # Makes the version show up on pkg.go.dev right away.
          for mod in github.com/rossedman/keyload github.com/rossedman/keyload/grpccreds; do
            curl -fsS "https://proxy.golang.org/$mod/@v/$TAG.info" || echo "proxy has not seen $mod@$TAG yet"
          done
