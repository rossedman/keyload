name: Release

# Runs when a version tag is pushed, which `make release VERSION=vX.Y.Z` does
# (see CONTRIBUTING.md), or from the Actions tab for a version that is already
# tagged, to publish or refresh its release. It creates no tags itself: the repository's tag
# ruleset only lets the maintainer create them. It checks that both modules
# are tagged on the same commit, runs the tests, and publishes the GitHub
# release with the CHANGELOG.md section as its notes. If the release already
# exists, for example one made in the GitHub UI, its notes are replaced.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish, e.g. v0.2.0"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: "**/go.sum"

      - name: Check the tags, changelog and grpccreds/go.mod
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Not a version tag: $TAG"; exit 1; }
          grep -q "^## \[${TAG#v}\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
          required=$(cd grpccreds && go mod edit -json | jq -r '.Require[] | select(.Path=="github.com/rossedman/keyload") | .Version')
          [ "$required" = "$TAG" ] || { echo "grpccreds/go.mod requires keyload $required, want $TAG"; exit 1; }
          git rev-parse -q --verify "refs/tags/grpccreds/$TAG" >/dev/null || {
            echo "::error::grpccreds/$TAG is missing. Tag releases with 'make release VERSION=$TAG', which pushes both tags."
            exit 1
          }
          [ "$(git rev-list -n1 "grpccreds/$TAG")" = "$(git rev-list -n1 "$TAG")" ] || {
            echo "::error::$TAG and grpccreds/$TAG are on different commits"
            exit 1
          }

      - name: Test
        run: |
          go test -race ./...
          (cd grpccreds && go test -race ./...)

      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]+\]: / { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          test -s "$RUNNER_TEMP/notes.md" || { echo "CHANGELOG.md has no section for $version"; exit 1; }
          cat >> "$RUNNER_TEMP/notes.md" <<NOTES

          ## Install

          \`\`\`sh
          go get github.com/rossedman/keyload@$TAG
          go get github.com/rossedman/keyload/grpccreds@$TAG   # for grpc-go
          \`\`\`
          NOTES
          cat "$RUNNER_TEMP/notes.md"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "keyload $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            prerelease=""
            [[ "$TAG" == *-* ]] && prerelease="--prerelease"
            gh release create "$TAG" --title "keyload $TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag $prerelease
          fi

      - name: Tell the Go module proxy
        run: |
          # Makes the version show up on pkg.go.dev right away.
          for mod in github.com/rossedman/keyload github.com/rossedman/keyload/grpccreds; do
            curl -fsS "https://proxy.golang.org/$mod/@v/$TAG.info" || echo "proxy has not seen $mod@$TAG yet"
          done
